name: tkxel-cms

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      # Exposed to the host so `make dev` and the test suite talk to the same DB
      # the containers use. One database, no drift.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && npm run dev"
    environment:
      DATABASE_URL: postgresql://cms:cms@db:5432/cms?schema=public
      ARTIFACTS_DIR: /app/artifacts
      NEXT_PUBLIC_RUNTIME_API: http://localhost:3000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Anonymous volumes shadow the host's Windows-native node_modules/.next
      # so the container keeps its own Linux binaries (prisma engines, swc).
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # A genuinely separate OS process polling build_jobs. Not an in-process job.
    # You can `docker compose kill worker` mid-build and watch the release stay
    # non-live while the previous artifact keeps serving.
    command: sh -c "npx prisma generate && npm run worker"
    environment:
      DATABASE_URL: postgresql://cms:cms@db:5432/cms?schema=public
      ARTIFACTS_DIR: /app/artifacts
      NEXT_PUBLIC_RUNTIME_API: http://localhost:3000
      WORKER_POLL_MS: "250"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
# NOTE: ./artifacts is deliberately NOT a named volume. It rides the `.:/app`
# bind mount so the immutable build output is visible on the host filesystem —
# open the folder, read the frozen HTML, checksum it before and after a rollback.
# The architecture claim is only convincing if you can see the files.
