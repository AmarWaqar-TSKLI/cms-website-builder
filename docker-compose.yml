name: tkxel-cms

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      # Exposed to the host so `make dev` and the test suite talk to the same DB
      # the containers use. One database, no drift.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Production build, production server. `make dev` runs the dev server on the
    # host for iteration; the containers serve what a deploy would actually run.
    command: sh -c "npx prisma migrate deploy && npm start"
    environment:
      DATABASE_URL: postgresql://cms:cms@db:5432/cms?schema=public
      ARTIFACTS_DIR: /app/artifacts
      NEXT_PUBLIC_RUNTIME_API: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      # ONLY the artifact directory is shared. The source and node_modules come
      # from the image, so there is no host/container binary mismatch to paper
      # over with shadow volumes — that trick is fragile on Windows and was
      # failing with I/O errors while copying node_modules into the volume.
      # Iterate with `make dev`, which runs the app on the host instead.
      - ./artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # A genuinely separate OS process polling build_jobs. Not an in-process job.
    # You can `docker compose kill worker` mid-build and watch the release stay
    # non-live while the previous artifact keeps serving.
    command: npm run worker:once
    environment:
      DATABASE_URL: postgresql://cms:cms@db:5432/cms?schema=public
      ARTIFACTS_DIR: /app/artifacts
      NEXT_PUBLIC_RUNTIME_API: http://localhost:3000
      # Where the worker reaches the app to warm the new release after a build.
      # Not localhost: inside compose the app is another container.
      APP_INTERNAL_URL: http://app:3000
      WORKER_POLL_MS: "250"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
# NOTE: artifacts are a HOST BIND MOUNT, deliberately not a named volume, so the
# immutable build output is visible on your filesystem — open the folder, read
# the frozen HTML, checksum it before and after a rollback. The architecture
# claim is only convincing if you can see the files. It is also how the app
# container and the worker container share one artifact directory.
